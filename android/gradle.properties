org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true

# Kotlin's incremental compiler tries to compute a relative path between the
# pub cache (C:\Users\...) and this project (D:\Projects\...). On Windows
# that fails with "this and base files have different roots" since a
# relative path can't cross drive letters. Incremental compilation isn't
# needed for a release build anyway, so just turn it off.
kotlin.incremental=false
